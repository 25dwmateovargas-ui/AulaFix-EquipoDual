<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AulaFix — Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-glow"></div>

<div class="page">
  <div class="center-shell">
    <div class="card login-card">
      <div class="login-head">
        <div class="brand" style="margin-bottom:10px;">
          <span class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#0b0c10" stroke-width="2" stroke-linejoin="round"/>
              <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#0b0c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </span>
          AulaFix
        </div>
        <p>Gestión de incidencias del aula</p>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" placeholder="alumno@centro.edu" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="row-between" style="margin-bottom:22px;">
          <label class="checkbox-label">
            <input type="checkbox" name="recordar">
            Recordarme
          </label>
          <a href="#" class="link-accent">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">
          Iniciar sesión
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#0b0c10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="demo-hint">Cuenta de demostración · alumno / 1234</p>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
